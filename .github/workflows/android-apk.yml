name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output
        run: mkdir -p build

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: godot --headless --path . --export-debug Android build/RallanAdventure.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RallanAdventure-APK
          path: build/RallanAdventure.apk
          if-no-files-found: error
          retention-days: 14
